<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محسن - المساعد الذكي</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat{
    width:95%;
    max-width:420px;
    height:90vh;
    background:#1e293b;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.header{
    background:#2563eb;
    color:white;
    padding:15px;
    text-align:center;
    font-size:18px;
    border-radius:15px 15px 0 0;
}

.messages{
    flex:1;
    padding:10px;
    overflow-y:auto;
    color:white;
}

.user{
    text-align:right;
    margin:8px 0;
    color:#38bdf8;
}

.bot{
    text-align:left;
    margin:8px 0;
    color:#22c55e;
}

.input{
    display:flex;
    border-top:1px solid #334155;
}

.input input{
    flex:1;
    padding:12px;
    border:none;
    outline:none;
    background:#0f172a;
    color:white;
}

.input button{
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="chat">
    <div class="header">🤖 محسن - مساعدك الذكي</div>

    <div class="messages" id="chatBox">
        <div class="bot">مرحبًا 👋 كيف أستطيع مساعدتك؟</div>
    </div>

    <div class="input">
        <input type="text" id="msg" placeholder="اكتب هنا...">
        <button onclick="sendMessage()">أرسل</button>
    </div>
</div>

<script>
async function sendMessage(){
    let input = document.getElementById("msg");
    let text = input.value.trim();
    if(text === "") return;

    let box = document.getElementById("chatBox");

    box.innerHTML += `<div class="user"><b>أنت:</b> ${text}</div>`;
    box.scrollTop = box.scrollHeight;

    try{
        let response = await fetch("/chat", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({message:text})
        });

        let data = await response.json();

        box.innerHTML += `<div class="bot">${data.reply}</div>`;
        box.scrollTop = box.scrollHeight;

    }catch(error){
        box.innerHTML += `<div class="bot">⚠️ تعذر الاتصال بالسيرفر</div>`;
    }

    input.value="";
}

document.getElementById("msg").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        sendMessage();
    }
});
</script>

</body>
</html>
