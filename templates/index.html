<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Shat Bot</title>
<style>
  /* كامل الصفحة للشات */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: black ;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #chat {
    width: 100%;
    max-width: 600px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  #header {
    background: #4caf50;
    color: white;
    font-weight: bold;
    font-size: 24px;
    padding: 15px;
    text-align: center;
  }

  #messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    padding: 12px 18px;
    border-radius: 20px;
    max-width: 80%;
    word-wrap: break-word;
    line-height: 1.4;
    font-size: 16px;
  }

  .user {
    background: #d1e7ff;
    align-self: flex-end;
    text-align: right;
  }

  .bot {
    background: #e2ffe2;
    align-self: flex-start;
    text-align: left;
  }

  #inputArea, #answerBox {
    display: flex;
    gap: 10px;
    padding: 10px;
    border-top: 1px solid #ddd;
  }

  input[type="text"] {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid #ccc;
  }

  button {
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    background: #4caf50;
    color: white;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    background: #45a049;
  }

  #answerBox {
    display: none;
  }
</style>
</head>
<body>
<div id="chat">
  <div id="header">🤖 chat Bot</div>
  <div id="messages"></div>

  <!-- إدخال السؤال -->
  <div id="inputArea">
    <input type="text" id="userMessage" placeholder="اكتب سؤالك هنا...">
    <button onclick="sendMessage()">إرسال</button>
  </div>

  <!-- إدخال الإجابة إذا لم يعرف البوت -->
  <div id="answerBox">
    <input type="text" id="userAnswer" placeholder="أدخل الإجابة ليتم التعلم منها">
    <button onclick="sendAnswer()">تعلم</button>
  </div>
</div>

<script>
let pendingQuestion = "";

// إضافة رسالة جديدة للواجهة
function addMessage(text, sender) {
  const div = document.createElement("div");
  div.classList.add("message", sender);
  div.innerText = text;
  document.getElementById("messages").appendChild(div);
  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
}

// إرسال سؤال المستخدم
async function sendMessage() {
  const msgInput = document.getElementById("userMessage");
  const message = msgInput.value.trim();
  if (!message) return;
  addMessage(message, "user");
  msgInput.value = "";

  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: message })
  });

  const data = await res.json();

  addMessage(data.reply, "bot");

  if (data.learn) {
    pendingQuestion = message;
    document.getElementById("answerBox").style.display = "flex";
  }
}

// إرسال إجابة لتعليم البوت
async function sendAnswer() {
  const answerInput = document.getElementById("userAnswer");
  const answer = answerInput.value.trim();
  if (!answer || !pendingQuestion) return;

  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: pendingQuestion, answer: answer })
  });

  const data = await res.json();

  addMessage(answer, "user");
  addMessage(data.reply, "bot");

  answerInput.value = "";
  pendingQuestion = "";
  document.getElementById("answerBox").style.display = "none";
}

// جعل Enter يرسل الرسالة
document.getElementById("userMessage").addEventListener("keyup", function(e){
  if(e.key === "Enter"){ sendMessage(); }
});
document.getElementById("userAnswer").addEventListener("keyup", function(e){
  if(e.key === "Enter"){ sendAnswer(); }
});
</script>
</body>
</html>
